<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Weather App</title>
    <link rel="stylesheet" href="./code/styles.css" />
</head>
<body>
    <div class="weather-container">
        <div class="current-weather">
            <p id="description">clear sky | 15°C</p>
        </div>

        <div class="sun-times">
            <p id="sunrise">Sunrise: 16:07</p>
            <p id="sunset">Sunset: 19:07</p>
        </div>

        <div class="weather-icon">
            <img id="weather-icon" src="" alt="Current Weather Icon"/>
        </div>

        <div class="weather-text" id=""weather-message">
            <p id="weather-message"></p>
        </div>

        <div class="bottom-row">
            <div class="forecast" id=""four-day-forecast">
                <div class="forecast-container">
                    <div id="four-day-forecast"></div>
                    <div class="day-container">
                    </div>
                </div>
        <div class="search-form">
            <input 
            type="text"
            id="search-city"
            placeholder="Enter city name"
            />
            <button id="search-button">Search</button>
        </div>
        <div>
            <footer>2024-09-29 Johanna Eriksson</footer>
        </div>
    </div>
<script src="./code/script.js"></script>
</body>
</html>
